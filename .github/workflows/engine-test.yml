# Builds the throwaway engine test app (app id app.turbobox.enginetest). The APK is a workflow artifact, never a release,
# so the real app's update check cannot pick it up.
name: Engine test
on:
  push:
    branches: [claude/engine-spike]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        run: |
          cd android && chmod +x gradlew
          ./gradlew --no-daemon :engine-test:assembleRelease
          cp engine-test/build/outputs/apk/release/engine-test-release.apk ../engine-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: engine-test
          path: engine-test.apk
          retention-days: 30
