# Test builds, published as a pre-release with the next number in the normal version sequence, next to the latest official
# TurboBox APK, which keeps its own version name. The app's updater reads the version from that APK's file name, so a feature
# test is never offered as an update.
#   1. engine-test.apk  : loads a page in Mozilla's GeckoView engine (own app id)
#   2. sandbox-test.apk : an Apache-2.0 app-virtualization engine (upstream pinned below), built here with every sensitive
#                         permission removed, so apps inside it cannot get the camera, microphone, location, contacts, ...
#   3. the latest official TurboBox APK, copied from the latest release
name: Feature test
on:
  push:
    branches: [claude/engine-spike]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: featuretest
  cancel-in-progress: true
env:
  UPSTREAM_REPO: ALEX5402/NewBlackbox
  UPSTREAM_SHA: 89b59836c66f173756a4ae258cf379a957649820
jobs:
  gecko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          cd android && chmod +x gradlew
          ./gradlew --no-daemon :engine-test:assembleRelease
          cp engine-test/build/outputs/apk/release/engine-test-release.apk ../engine-test.apk
      - uses: actions/upload-artifact@v4
        with: { name: gecko, path: engine-test.apk, retention-days: 7 }

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Remove every sensitive permission from the app (the engine's own manifests declare camera, microphone, SMS, ...)
        run: |
          python3 - <<'PY'
          import re
          p = 'app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          names = """CAMERA RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION ACCESS_MEDIA_LOCATION
          READ_CONTACTS WRITE_CONTACTS GET_ACCOUNTS AUTHENTICATE_ACCOUNTS MANAGE_ACCOUNTS READ_CALENDAR WRITE_CALENDAR
          READ_CALL_LOG WRITE_CALL_LOG PROCESS_OUTGOING_CALLS CALL_PHONE READ_PHONE_STATE READ_PHONE_NUMBERS READ_PRECISE_PHONE_STATE
          READ_SMS SEND_SMS RECEIVE_SMS WRITE_SMS BODY_SENSORS BODY_SENSORS_BACKGROUND BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_ADVERTISE
          BLUETOOTH_CONNECT BLUETOOTH_SCAN READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE READ_MEDIA_IMAGES
          READ_MEDIA_VIDEO READ_MEDIA_AUDIO READ_MEDIA_VISUAL READ_MEDIA_AURAL READ_MEDIA_IMAGES_USER_SELECTED
          READ_MEDIA_VIDEO_USER_SELECTED READ_MEDIA_AUDIO_USER_SELECTED READ_MEDIA_VISUAL_USER_SELECTED
          READ_MEDIA_AURAL_USER_SELECTED REQUEST_INSTALL_PACKAGES RESTART_PACKAGES FOREGROUND_SERVICE_MICROPHONE
          FOREGROUND_SERVICE_CAMERA FOREGROUND_SERVICE_LOCATION FOREGROUND_SERVICE_PHONE_CALL SYSTEM_ALERT_WINDOW""".split()
          # The same names with the Google and Samsung prefixes the engine also declares
          extra = [l.split('"')[1] for l in open('Bcore/src/main/AndroidManifest.xml', encoding='utf-8').read().split('\n')
                   if 'uses-permission' in l and 'name="' in l and not l.strip().startswith('<!--')]
          bad = {n for n in extra if n.rsplit('.', 1)[-1] in names or n.startswith(('com.google.android.gms.permission', 'com.samsung'))}
          bad |= {'android.permission.' + n for n in names}
          # The app's own manifest may already declare some of them: drop those declarations first (a duplicate fails the merge)
          for n in bad:
              s = re.sub(r'<uses-permission[^>]*android:name="' + re.escape(n) + r'"[^>]*/>', '', s)
          rm = ''.join('    <uses-permission android:name="%s" tools:node="remove" />\n' % n for n in sorted(bad))
          s = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + '\n' + rm, s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          print(len(bad), 'permissions removed')
          PY
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" sandbox-test.apk
      - name: Prove the camera and microphone are not in the app
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump permissions sandbox-test.apk | tee perms.txt
          if grep -E "CAMERA|RECORD_AUDIO|LOCATION|CONTACTS|SMS|CALL_LOG|READ_PHONE" perms.txt; then echo "A sensitive permission is still in the app"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: sandbox, path: "sandbox-test.apk\nperms.txt", retention-days: 7 }

  publish:
    needs: [gecko, sandbox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Pick the version number and fetch the latest official APK
        id: ver
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          # Feature tests take the next number in the normal sequence (v2026.11.14), so the next real release continues after it.
          # While the newest release is itself a feature test, a new push replaces it instead of using up another number.
          prefix="v$(date -u +%Y.%-m)."
          last=$(git tag -l "${prefix}*" | sed "s/^${prefix}//" | sort -n | tail -1)
          if [ -n "$last" ] && gh release view "${prefix}${last}" --json body --jq .body | grep -q FEATURETEST; then
            tag="${prefix}${last}"
          else
            tag="${prefix}$(( ${last:--1} + 1 ))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Feature test release: $tag"
          # The latest official TurboBox APK keeps its own version name (feature tests are pre-releases, so "latest" skips them).
          mkdir official
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'turbobox-*-android.apk' --dir official
          ls official
      - name: Publish the pre-release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          TAG='${{ steps.ver.outputs.tag }}'
          gh release delete featuretest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          OFFICIAL=$(ls official/turbobox-*-android.apk | head -1)
          cat > notes.md <<'NOTES'
          FEATURETEST. Test builds, kept in the normal version sequence so the next real release continues after this number.

          - `turbobox-<version>-android.apk`: the latest official TurboBox, unchanged and still under its own version. This is the one the app's updater uses.
          - `engine-test.apk`: a throwaway app that loads one page in Mozilla's GeckoView engine instead of Android's WebView.
          - `sandbox-test.apk`: an app-virtualization engine (upstream: Apache-2.0, pinned commit) built with every sensitive permission removed. It is unaudited third-party code. `perms.txt` lists the permissions it really holds.

          None of the test apps are part of TurboBox, and none can use the camera or microphone.
          NOTES
          # The official APK goes up first so it is the first .apk of the release.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG FEATURETEST" \
            --prerelease --latest=false --notes-file notes.md "$OFFICIAL"
          for f in files/engine-test.apk files/sandbox-test.apk files/perms.txt; do
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
          done
