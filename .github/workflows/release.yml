# Every merge to main builds the Android APK and publishes it as a new release; installed apps update themselves from it
# (android/app/src/main/java/app/turbobox/AppUpdater.java). Nothing to tag by hand.
# The version is the year, the month and a counter: v2026.10.0, v2026.10.1, ... (the counter restarts each month).
# Documentation-only changes do not release. "Run workflow" in the Actions tab releases the current main on demand.
# A pull request from a branch (or with a title) containing "featuretest" is a feature test: instead of a TurboBox build it
# publishes a pre-release with the test APKs and the latest official APK (see featuretest.yml).
name: Release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      feature: ${{ steps.d.outputs.feature }}
    steps:
      - id: d
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          info=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[] | .head.ref + " " + .title' 2>/dev/null || true)
          if echo "$HEAD_MSG $info" | grep -qi featuretest; then echo "feature=true" >> "$GITHUB_OUTPUT"; else echo "feature=false" >> "$GITHUB_OUTPUT"; fi

  feature:
    needs: detect
    if: needs.detect.outputs.feature == 'true'
    uses: ./.github/workflows/featuretest.yml
    permissions:
      contents: write

  release:
    needs: detect
    if: needs.detect.outputs.feature != 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Work out the next version
        id: next
        run: |
          prefix="v$(date -u +%Y.%-m)."
          last=$(git tag -l "${prefix}*" | sed "s/^${prefix}//" | sort -n | tail -1)
          tag="${prefix}$(( ${last:--1} + 1 ))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"
      - name: Create the release (this also creates the tag)
        run: gh release create "${{ steps.next.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "${{ steps.next.outputs.tag }}" --generate-notes
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the repository's signing key when it has one (else the committed keystore, which keeps updates installing)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='${{ needs.release.outputs.tag }}'
          VERSION="${TAG#v}"
          cd android && chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease -PappVersion="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "../turbobox-$VERSION-android.apk"
          cd .. && gh release upload "$TAG" "turbobox-$VERSION-android.apk" --clobber
