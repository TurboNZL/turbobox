plugins {
    id 'com.android.application'
}

// A throwaway test app (its own app id, installs beside TurboBox) that loads a page in Mozilla's GeckoView engine
// instead of the system WebView, to see whether a site treats the two engines differently. It is not part of TurboBox.
android {
    namespace 'app.turbobox.enginetest'
    compileSdk 35

    defaultConfig {
        applicationId 'app.turbobox.enginetest'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        shared {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    // Version 140 is used because newer ones need a newer Android Gradle plugin than this project has.
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:140.0.20250707120347'
}
